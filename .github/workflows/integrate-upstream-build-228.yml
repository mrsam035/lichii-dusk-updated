name: integrate-upstream-build-228

on:
  push:
    branches:
      - update/lichii-build-228-duskbloods
    paths:
      - .github/workflows/integrate-upstream-build-228.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  workflows: write

concurrency:
  group: integrate-upstream-build-228
  cancel-in-progress: false

jobs:
  merge-upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the Duskbloods Build 177 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: update/lichii-build-228-duskbloods
          fetch-depth: 0
          persist-credentials: true

      - name: Merge the official Lichii build-228 tag
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/zortos293/Lichii.git
          git fetch --no-tags upstream refs/tags/build-228
          upstream_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          echo "Upstream build-228 commit: $upstream_sha"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit -X ours "$upstream_sha" \
            -m "Merge upstream Lichii build-228 into Duskbloods fork"
          git push origin "HEAD:refs/heads/update/lichii-build-228-duskbloods"

      - name: Open or update the Build 228 pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="update/lichii-build-228-duskbloods"
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base dusk-v2 --json number --jq '.[0].number // empty')"
          body="$(cat <<'EOF'
          ## Lichii Build 228 integration for The Duskbloods

          This PR advances the Duskbloods emulator from the official Lichii `build-177` base to the official `build-228` tag.

          ### Merge approach
          - Merge the complete upstream `build-228` tag; this carries the full upstream code, dependency, renderer, shader, UI, and build-system changes rather than selectively copying files.
          - Preserve Duskbloods-fork changes in overlapping hunks (`-X ours`) and use the Windows build to expose any API changes that need a careful manual port.
          - Keep the playDB-CNT environment-variable lookup encoded at runtime so the launcher can still offer **Patch Lichii**.
          - Keep the Duskbloods runtime, BCAT, shader/Vulkan, memory/performance, and temporal-weight changes already present on the Build 177 branch.
          - Do not bundle `version.dll`; playDB-CNT remains responsible for installing it.

          ### Validation
          A successful Windows CI build only proves compilation and packaging. It does not replace a real playDB-CNT patch-detection test or an in-game Duskbloods test. Keep this PR unmerged until those checks are completed.
          EOF
          )"
          if [[ -z "$pr_number" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base dusk-v2 --head "$branch" \
              --title "Integrate Lichii build 228 while preserving Duskbloods support" \
              --body "$body" --draft
          else
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title \
              "Integrate Lichii build 228 while preserving Duskbloods support" --body "$body"
          fi

      - name: Dispatch the Windows x64 build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run windows-build.yml --repo "$GITHUB_REPOSITORY" \
            --ref update/lichii-build-228-duskbloods
          echo "Windows build dispatched for update/lichii-build-228-duskbloods."
